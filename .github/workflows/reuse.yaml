name: REUSE compliance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check REUSE compliance
        uses: fsfe/reuse-action@v6
        with:
          args: lint --lines

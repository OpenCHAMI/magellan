name: Release with GoReleaser

on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    # Releases require QEMU and Docker Buildx, which are unavailable on the
    # unprivileged ubuntu-slim runner.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9] ]]; then
            echo "Release tag must begin with v followed by a number" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils-aarch64-linux-gnu \
            g++ \
            gcc \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build metadata
        run: |
          {
            echo "GIT_STATE=$(if git diff-index --quiet HEAD --; then echo clean; else echo dirty; fi)"
            echo "GO_VERSION=$(go env GOVERSION)"
            echo "BUILD_HOST=$(hostname)"
            echo "BUILD_USER=$(whoami)"
            echo "CGO_ENABLED=1"
            echo "IS_PR_BUILD=false"
          } >> "${GITHUB_ENV}"

      - name: Release
        id: goreleaser
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: "~> v2"
          args: release --clean

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt
